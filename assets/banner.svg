<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="pulse-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.1" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <!-- Glass Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.65; }
    }
    @keyframes pulseWave {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes scanline {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.5; }
      100% { transform: translateY(500px); opacity: 0; }
    }
    .orb-1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 200px 150px;
    }
    .orb-2 {
      animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
      transform-origin: 1000px 250px;
    }
    .wave-line {
      stroke-dasharray: 200 40;
      animation: pulseWave 14s linear infinite;
    }
    .wave-line-2 {
      stroke-dasharray: 120 60;
      animation: pulseWave 18s linear infinite reverse;
    }
    .pill-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-2 { animation: floatPill 6s ease-in-out infinite 1s; }
    .pill-3 { animation: floatPill 5.5s ease-in-out infinite 0.5s; }
    .pill-4 { animation: floatPill 6.5s ease-in-out infinite 1.5s; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- Animated Glowing Ambience Orbs in Background -->
  <g class="orb-1">
    <circle cx="200" cy="120" r="180" fill="#6366f1" filter="blur(70px)" opacity="0.35" />
    <circle cx="280" cy="80" r="110" fill="#ec4899" filter="blur(60px)" opacity="0.25" />
  </g>
  <g class="orb-2">
    <circle cx="1020" cy="260" r="210" fill="#06b6d4" filter="blur(80px)" opacity="0.3" />
    <circle cx="940" cy="300" r="130" fill="#8b5cf6" filter="blur(65px)" opacity="0.25" />
  </g>

  <!-- High-Tech Coordinate Grid -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Predictive Waves & Trend Lines (Background Layer) -->
  <g opacity="0.55">
    <path class="wave-line" d="M 0 320 Q 200 180, 400 290 T 800 200 T 1200 240" fill="none" stroke="url(#pulse-line)" stroke-width="2.5" />
    <path class="wave-line-2" d="M 0 360 Q 300 240, 600 340 T 1000 220 T 1200 280" fill="none" stroke="url(#cyan-glow)" stroke-width="2" stroke-dasharray="10 5" />
    <!-- Dynamic Anomaly Nodes -->
    <circle cx="400" cy="290" r="4.5" fill="#f43f5e">
      <animate attributeName="r" values="3.5;7;3.5" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="200" r="4.5" fill="#38bdf8">
      <animate attributeName="r" values="3.5;7;3.5" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="220" r="4.5" fill="#a855f7">
      <animate attributeName="r" values="3.5;7;3.5" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Foreground Content Area: Clear, High-Contrast Typography -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 65)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.2" opacity="0.9" />
    <circle cx="-115" cy="0" r="5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-98" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="2">CURATED ARCHITECTURE</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    AI Predictive Insights &amp; Recommendations
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
    Production SaaS Platforms &bull; Open-Source ML Engines &bull; Anomaly Detection &bull; Recommendation Systems
  </text>

  <!-- Dynamic Feature Badges / Pills -->
  <g transform="translate(0, 245)">
    <!-- Pill 1: Anomaly Detection -->
    <g class="pill-1" transform="translate(180, 0)">
      <rect x="0" y="0" width="180" height="42" rx="21" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="24" cy="21" r="5" fill="#38bdf8" />
      <text x="40" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Anomaly Detection</text>
    </g>

    <!-- Pill 2: Time Series & Forecasting -->
    <g class="pill-2" transform="translate(390, 0)">
      <rect x="0" y="0" width="190" height="42" rx="21" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.2" />
      <circle cx="24" cy="21" r="5" fill="#818cf8" />
      <text x="40" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Predictive Forecasts</text>
    </g>

    <!-- Pill 3: Recommender Engines -->
    <g class="pill-3" transform="translate(610, 0)">
      <rect x="0" y="0" width="195" height="42" rx="21" fill="url(#card-grad)" stroke="#c084fc" stroke-width="1.2" />
      <circle cx="24" cy="21" r="5" fill="#c084fc" />
      <text x="40" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">RecSys Engines</text>
    </g>

    <!-- Pill 4: Causal Intelligence -->
    <g class="pill-4" transform="translate(835, 0)">
      <rect x="0" y="0" width="185" height="42" rx="21" fill="url(#card-grad)" stroke="#f472b6" stroke-width="1.2" />
      <circle cx="24" cy="21" r="5" fill="#f472b6" />
      <text x="40" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Causal AI Analytics</text>
    </g>
  </g>

  <!-- Accent Bottom Border Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#primary-glow)" />
</svg>
